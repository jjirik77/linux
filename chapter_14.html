    <script>
        // --- Core Application State Model ---
        const state = {
            screen: 1,
            totalScreens: 10,
            
            // Interactive Tools State
            activeTermIndex: null,
            selectedLayerIndex: 2, // Layer 3 Network by default
            binaryBits: [0, 0, 0, 0, 0, 0, 0, 0],
            targetBinaryVal: 179,
            cidr: 24,
            
            // Terminal & System Simulation State
            ifaceUp: true,
            terminalHistory: [],
            commandHistory: [],
            historyIndex: -1,
            
            // Capstone & Challenge Objectives
            capstoneFaults: {
                gateway: false,   // true when default route is fixed
                dns: false        // true when resolv.conf nameserver is added
            },
            missionComplete: false,
            hintLevel: -1,
            completedScreens: [],
            
            // Pre-assessment state
            preAssessmentScore: null,
            preAssessmentAnswers: {},

            // Matching activity state
            portMatches: {}
        };

        // --- Chapter 14 Key Terms Dataset ---
        const KEY_TERMS = [
            { term: 'IP Address', cat: 'Addressing', definition: 'A logical Layer 3 32-bit (IPv4) or 128-bit (IPv6) numerical address assigned to each device on a network.' },
            { term: 'Subnet Mask', cat: 'Addressing', definition: 'A 32-bit bitmask that differentiates the network portion of an IP address from the host portion.' },
            { term: 'CIDR Notation', cat: 'Addressing', definition: 'Classless Inter-Domain Routing; uses a slash suffix (e.g., /24) to denote the number of contiguous 1 bits in the subnet mask.' },
            { term: 'Default Gateway', cat: 'Routing', definition: 'The router IP address on the local segment used to forward traffic destined outside the local subnet.' },
            { term: 'DNS (Domain Name System)', cat: 'Services', definition: 'Resolves human-readable domain names (e.g. google.com) into machine-routable IP addresses (port 53).' },
            { term: 'DHCP', cat: 'Services', definition: 'Dynamic Host Configuration Protocol; automatically leases IP addresses, subnet masks, gateways, and DNS servers to clients.' },
            { term: 'Predictable NIC Names', cat: 'Interfaces', definition: 'Modern systemd scheme replacing ethX with hardware-based names: eno (on-board), ens (hotplug slot), enp (PCI bus).' },
            { term: 'NetworkManager / nmcli', cat: 'Tools', definition: 'The standard daemon and CLI tool in modern enterprise Linux for creating, editing, activating, and managing connections.' },
            { term: 'MTU (Maximum Transmission Unit)', cat: 'Hardware', definition: 'The largest packet or frame size (usually 1500 bytes for Ethernet) that can be sent without fragmentation.' },
            { term: 'ss (Socket Statistics)', cat: 'Diagnostics', definition: 'The high-performance, modern replacement for netstat used to inspect listening sockets, TCP states, and ports.' },
            { term: 'netcat (nc)', cat: 'Diagnostics', definition: 'The "Swiss Army knife" utility for reading and writing network connections across TCP/UDP ports.' },
            { term: 'Chrony & NTP', cat: 'Services', definition: 'Time synchronization software (chronyd daemon and chronyc tool) ensuring system clocks match standard reference time.' },
            { term: 'SLAAC (IPv6)', cat: 'IPv6', definition: 'Stateless Address Autoconfiguration; enables IPv6 hosts to configure their own address using router advertisements and EUI-64.' },
            { term: 'NFS / CIFS', cat: 'Storage', definition: 'Network-based filesystems; Network File System (Linux-native, port 2049) and Common Internet File System (SMB, port 445).' }
        ];

        // --- OSI & TCP/IP Reference Model ---
        const OSI_LAYERS = [
            { 
                layer: 7, 
                name: 'Application', 
                tcpip: 'Application',
                desc: 'Interfaces directly with applications and services requiring network access.', 
                icon: 'globe',
                protocols: 'HTTP (80), HTTPS (443), SSH (22), DNS (53), FTP (20/21), SMTP (25)',
                tools: 'curl, wget, ssh, dig, nc',
                pdu: 'Data'
            },
            { 
                layer: 6, 
                name: 'Presentation', 
                tcpip: 'Application',
                desc: 'Formats, encrypts, and compresses data for consistent application interpretation.', 
                icon: 'lock',
                protocols: 'TLS/SSL, JPEG, ASCII, UTF-8',
                tools: 'openssl, gpg',
                pdu: 'Data'
            },
            { 
                layer: 5, 
                name: 'Session', 
                tcpip: 'Application',
                desc: 'Establishes, manages, and terminates sessions between local and remote endpoints.', 
                icon: 'radio',
                protocols: 'RPC, NetBIOS, SOCKS',
                tools: 'rpcinfo, who, w',
                pdu: 'Data'
            },
            { 
                layer: 4, 
                name: 'Transport', 
                tcpip: 'Transport',
                desc: 'Provides end-to-end communication services. TCP delivers reliable, sequenced data; UDP provides connectionless speed.', 
                icon: 'zap',
                protocols: 'TCP (Transmission Control Protocol), UDP (User Datagram Protocol)',
                tools: 'ss -tuln, netstat, nc -zv, iperf3',
                pdu: 'Segment (TCP) / Datagram (UDP)'
            },
            { 
                layer: 3, 
                name: 'Network', 
                tcpip: 'Internet',
                desc: 'Handles logical addressing, path determination, packet routing, and subnet boundary separation.', 
                icon: 'layers',
                protocols: 'IPv4, IPv6, ICMP, ARP, IPsec',
                tools: 'ip addr, ip route, ping, traceroute, tracepath',
                pdu: 'Packet'
            },
            { 
                layer: 2, 
                name: 'Data Link', 
                tcpip: 'Network Access',
                desc: 'Manages physical node-to-node frame transfer over the physical segment using hardware MAC addresses.', 
                icon: 'database',
                protocols: 'Ethernet (802.3), Wi-Fi (802.11), PPP, VLAN (802.1Q)',
                tools: 'ip link, ethtool, brctl, bridge',
                pdu: 'Frame'
            },
            { 
                layer: 1, 
                name: 'Physical', 
                tcpip: 'Network Access',
                desc: 'Transmits unstructured raw bit streams over physical copper, fiber-optic, or radio frequency media.', 
                icon: 'cpu',
                protocols: 'Cat6a RJ45, 10GBASE-T, Fiber SFP+, Radio Waves',
                tools: 'ethtool ens32 (Link detected: yes/no), mii-tool',
                pdu: 'Bits'
            }
        ];

        // --- Common Ports Dataset ---
        const COMMON_PORTS = [
            { service: 'SSH', port: '22', desc: 'Secure Shell remote administration' },
            { service: 'DNS', port: '53', desc: 'Domain Name System queries' },
            { service: 'HTTP', port: '80', desc: 'Hypertext Transfer Protocol' },
            { service: 'HTTPS', port: '443', desc: 'Encrypted Web Traffic (TLS/SSL)' },
            { service: 'NTP', port: '123', desc: 'Network Time Protocol synchronization' },
            { service: 'DHCP', port: '67/68', desc: 'Dynamic Host Configuration' },
            { service: 'NFS', port: '2049', desc: 'Network File System remote storage' },
            { service: 'SMTP', port: '25', desc: 'Simple Mail Transfer Protocol' }
        ];

        // --- Module Contextual Hints Matrix (Diagnostic Ladder) ---
        const MODULE_HINTS = {
            6: [
                { level: "Diagnostic Direction (Layer 2/3)", text: "Begin by identifying all network interfaces recognized by the Linux kernel. Modern systemd assigns predictable names like ens32 or enp0s3." },
                { level: "Technical Analysis", text: "Look for the ethernet interface state (flags must include UP and RUNNING) and check if an IPv4 address is assigned with its prefix mask." },
                { level: "Command Syntax", text: "Run: \nip addr show\n# or check link states:\nip link show" }
            ],
            7: [
                { level: "Diagnostic Direction (Routing & DNS)", text: "External communication depends on two settings: a default gateway in the kernel routing table and valid DNS nameservers." },
                { level: "Technical Analysis", text: "Inspect the routing table to see if a 'default via <IP>' rule exists. Then check /etc/resolv.conf and /etc/nsswitch.conf." },
                { level: "Command Syntax", text: "Run: \nip route show\ncat /etc/resolv.conf\ncat /etc/nsswitch.conf" }
            ],
            8: [
                { level: "Diagnostic Direction (Troubleshooting Ladder)", text: "Follow the CompTIA ladder: test local loopback (127.0.0.1), then local IP, then default gateway, then external IP (8.8.8.8), and lastly hostname resolution." },
                { level: "Technical Analysis", text: "Check open listening ports with 'ss' and verify external TCP port accessibility using 'nc'." },
                { level: "Command Syntax", text: "Run: \nping -c 2 8.8.8.8\nss -tuln\nnc -zv 10.0.0.1 53" }
            ],
            9: [
                { level: "Diagnostic Direction (Capstone Root Cause)", text: "Server-one cannot access the internet. First test Layer 3 connectivity: can you ping 8.8.8.8? If unreachable, the default gateway is missing. If 8.8.8.8 responds but google.com fails, DNS is missing." },
                { level: "Technical Analysis", text: "You must perform two fixes:\n1. Add the default route pointing to 10.0.0.1 on interface ens32.\n2. Add the nameserver 8.8.8.8 to /etc/resolv.conf." },
                { level: "Command Syntax", text: "Step 1: ip route add default via 10.0.0.1\nStep 2: echo \"nameserver 8.8.8.8\" >> /etc/resolv.conf\nStep 3: ping google.com" }
            ]
        };

        // --- Core Navigation & Render Dispatcher ---
        function renderApp() {
            const sidebar = document.getElementById('sidebar-content');
            const main = document.getElementById('main-area');
            const progressNum = document.getElementById('header-module-num');
            const progressTitle = document.getElementById('header-module-title');
            const progressBar = document.getElementById('header-progress-bar');
            const progressPct = document.getElementById('header-progress-pct');
            
            const pct = Math.round((state.screen / state.totalScreens) * 100);
            progressBar.style.width = `${pct}%`;
            progressPct.innerText = `${pct}%`;
            progressNum.innerText = `MOD ${String(state.screen).padStart(2, '0')}`;

            document.getElementById('prev-btn').disabled = state.screen === 1;
            document.getElementById('next-btn').disabled = state.screen === state.totalScreens;

            sidebar.innerHTML = '';
            main.innerHTML = '';

            const titles = [
                "Orientation & Objectives",
                "Protocols, Ports & OSI",
                "IPv4 & Binary Octet Lab",
                "Subnetting & CIDR Logic",
                "IPv6 Addressing & Architecture",
                "NICs & NetworkManager",
                "Routing & Name Resolution",
                "Diagnostics, Sockets & Tools",
                "Capstone Recovery Mission",
                "Mastery Review & Exam Report"
            ];
            progressTitle.innerText = titles[state.screen - 1];

            switch(state.screen) {
                case 1: renderModule1(sidebar, main); break;
                case 2: renderModule2(sidebar, main); break;
                case 3: renderModule3(sidebar, main); break;
                case 4: renderModule4(sidebar, main); break;
                case 5: renderModule5(sidebar, main); break;
                case 6: renderModule6(sidebar, main); break;
                case 7: renderModule7(sidebar, main); break;
                case 8: renderModule8(sidebar, main); break;
                case 9: renderModule9(sidebar, main); break;
                case 10: renderModule10(sidebar, main); break;
            }

            renderGlossary();
            renderTopologyDiagram();
            lucide.createIcons();
        }

        // --- Helper: Inject Progressive Hints in Sidebar ---
        function injectHintsUI(container, screenNum) {
            const hints = MODULE_HINTS[screenNum];
            if (!hints) return;

            const box = document.createElement('div');
            box.className = "mt-5 pt-4 border-t border-slate-200 space-y-3";
            box.innerHTML = `
                <div class="flex items-center justify-between text-xs font-bold uppercase tracking-wider text-slate-500">
                    <span class="flex items-center gap-1.5"><i data-lucide="help-circle" class="w-3.5 h-3.5 text-amber-600"></i> Diagnostic Hints</span>
                    <span class="text-[10px] font-mono text-slate-500">${state.hintLevel >= 0 ? `${state.hintLevel + 1}/3` : '0/3'}</span>
                </div>
            `;

            if (state.hintLevel >= 0) {
                const hint = hints[state.hintLevel];
                const card = document.createElement('div');
                card.className = "p-3.5 bg-amber-50 border border-amber-200 rounded-xl animate-in text-xs";
                card.innerHTML = `
                    <div class="flex items-center gap-2 mb-1.5 text-amber-800 font-bold uppercase text-[10px] tracking-wider">
                        <i data-lucide="lightbulb" class="w-3.5 h-3.5"></i> ${hint.level}
                    </div>
                    <p class="text-amber-900 leading-relaxed font-mono whitespace-pre-wrap">${hint.text}</p>
                `;
                box.appendChild(card);
            }

            const btn = document.createElement('button');
            btn.className = "w-full py-2 px-3 bg-slate-100 hover:bg-amber-50 text-slate-700 hover:text-amber-800 text-xs font-semibold rounded-lg border border-slate-200 hover:border-amber-300 transition-all flex items-center justify-center gap-2";
            btn.innerHTML = `<i data-lucide="key" class="w-3.5 h-3.5 text-amber-600"></i> ${state.hintLevel === -1 ? 'Reveal Diagnostic Hint' : 'Get Next Level Hint'}`;
            btn.onclick = () => {
                state.hintLevel = (state.hintLevel + 1) % 3;
                renderApp();
            };
            box.appendChild(btn);
            container.appendChild(box);
        }

        // --- MODULE 1: Orientation & Diagnostic Pre-Assessment ---
        function renderModule1(sidebar, main) {
            sidebar.innerHTML = `

            // Command History Navigation (Up/Down arrow keys)
            input.onkeydown = (e) => {
                if (e.key === 'ArrowUp') {
                    if (state.historyIndex > 0) {
                        state.historyIndex--;
                        input.value = state.commandHistory[state.historyIndex];
                    }
                    e.preventDefault();
                } else if (e.key === 'ArrowDown') {
                    if (state.historyIndex < state.commandHistory.length - 1) {
                        state.historyIndex++;
                        input.value = state.commandHistory[state.historyIndex];
                    } else {
                        state.historyIndex = state.commandHistory.length;
                        input.value = '';
                    }
                    e.preventDefault();
                }
            };

            output.scrollTop = output.scrollHeight;
        }

        window.insertCommand = function(cmd) {
            const input = document.getElementById('terminal-input');
            if (input) {
                input.value = cmd;
                input.focus();
            }
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        // --- Bash Command Parsing Engine ---
        function processCommand(cmd) {
            const cleanCmd = cmd.trim();
            const parts = cleanCmd.split(/\s+/);
            const base = parts[0].toLowerCase();
            let out = "";
            let kudos = "";

            if (base === 'help') {
                out = "Available commands: ip, ping, ping6, ss, netstat, nc, dig, host, traceroute, chronyc, nmcli, ethtool, cat, echo, hostnamectl, clear";
            }
            else if (base === 'clear') {
                state.terminalHistory = [];
                return;
            }
            else if (base === 'hostname' || base === 'hostnamectl') {
                out = "Static hostname: server-one\nIcon name: computer-vm\nChassis: vm\nOperating System: Ubuntu 22.04.3 LTS\nKernel: Linux 5.15.0-89-generic";
            }
            else if (base === 'ip') {
                const sub = parts[1]?.toLowerCase();
                if (sub === 'addr' || sub === 'a') {
                    out = `1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN group default qlen 1000\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n    inet 127.0.0.1/8 scope host lo\n    inet6 ::1/128 scope host\n2: ens32: <BROADCAST,MULTICAST,${state.ifaceUp ? 'UP,LOWER_UP' : 'DOWN'}> mtu 1500 qdisc fq_codel state ${state.ifaceUp ? 'UP' : 'DOWN'} group default qlen 1000\n    link/ether 00:16:3e:ab:cd:ef brd ff:ff:ff:ff:ff:ff\n    inet 10.0.0.84/24 brd 10.0.0.255 scope global dynamic ens32\n    inet6 fe80::216:3eff:feab:cdef/64 scope link`;
                    if (state.screen === 6) {
                        kudos = "\n\n<span class=\"kudos-text font-bold text-emerald-400\">✨ [KUDOS] Interface inspection verified! You successfully inspected ens32 layer 2/3 parameters.</span>";
                        if (!state.completedScreens.includes(6)) state.completedScreens.push(6);
                    }
                }
                else if (sub === 'link' || sub === 'l') {
                    if (parts[2] === 'set' && parts[3] === 'ens32') {
                        if (parts[4] === 'down') {
                            state.ifaceUp = false;
                            out = "Interface ens32 set to DOWN administratively.";
                        } else if (parts[4] === 'up') {
                            state.ifaceUp = true;
                            out = "Interface ens32 set to UP.";
                        }
                    } else {
                        out = `1: lo: <LOOPBACK,UP> mtu 65536 qdisc noqueue state UNKNOWN\n2: ens32: <BROADCAST,MULTICAST,${state.ifaceUp ? 'UP' : 'DOWN'}> mtu 1500 state ${state.ifaceUp ? 'UP' : 'DOWN'}`;
                    }
                }
                else if (sub === 'route' || sub === 'r') {
                    if (parts[2] === 'add' && parts[3] === 'default' && parts[4] === 'via' && parts[5] === '10.0.0.1') {
                        state.capstoneFaults.gateway = true;
                        out = "Default route added via 10.0.0.1 dev ens32.";
                        kudos = "\n\n<span class=\"kudos-text font-bold text-emerald-400\">✨ [KUDOS] Default gateway restored! The kernel now knows how to route external packets.</span>";
                    } else {
                        if (state.screen === 9 && !state.capstoneFaults.gateway) {
                            out = "10.0.0.0/24 dev ens32 proto kernel scope link src 10.0.0.84";
                        } else {
                            out = "default via 10.0.0.1 dev ens32 proto static\n10.0.0.0/24 dev ens32 proto kernel scope link src 10.0.0.84";
                            if (state.screen === 7) {
                                kudos = "\n\n<span class=\"kudos-text font-bold text-emerald-400\">✨ [KUDOS] Routing table checked! Notice the 'default via 10.0.0.1' entry.</span>";
                                if (!state.completedScreens.includes(7)) state.completedScreens.push(7);
                            }
                        }
                    }
                }
            }
            else if (base === 'nmcli') {
                if (parts[1] === 'dev') {
                    out = "DEVICE  TYPE      STATE      CONNECTION\nens32   ethernet  connected  ens32\nlo      loopback  unmanaged  --";
                } else if (parts[1] === 'con') {
                    out = "NAME    UUID                                  TYPE      DEVICE\nens32   2f2a1e80-7a1f-44b8-a111-123456789abc  ethernet  ens32";
                } else {
                    out = "ens32: connected to ens32\n        \"Intel 82545EM Gigabit Ethernet Controller\"\n        ethernet (e1000), 00:16:3E:AB:CD:EF, hw, mtu 1500\n        inet4 10.0.0.84/24\n        route4 default via 10.0.0.1";
                }
            }
            else if (base === 'cat') {
                const targetFile = parts[1] || '';
                if (targetFile.includes('resolv.conf')) {
                    out = "search mydom.com" + (state.capstoneFaults.dns || state.screen !== 9 ? "\nnameserver 8.8.8.8" : "");
                    if (state.screen === 7) {
                        kudos = "\n\n<span class=\"kudos-text font-bold text-emerald-400\">✨ [KUDOS] /etc/resolv.conf queried! This defines the system's DNS recursive resolvers.</span>";
                        if (!state.completedScreens.includes(7)) state.completedScreens.push(7);
                    }
                } else if (targetFile.includes('nsswitch.conf')) {
                    out = "passwd:         files systemd\ngroup:          files systemd\nhosts:          files dns myhostname\nnetworks:       files";
                } else if (targetFile.includes('hosts')) {
                    out = "127.0.0.1 localhost\n10.0.0.84 server-one\n::1       localhost ip6-localhost ip6-loopback";
                } else {
                    out = `cat: ${targetFile}: No such file or directory`;
                }
            }
            else if (base === 'echo') {
                if (cleanCmd.includes('nameserver') && cleanCmd.includes('resolv.conf')) {
                    state.capstoneFaults.dns = true;
                    out = "nameserver 8.8.8.8 appended to /etc/resolv.conf";
                    kudos = "\n\n<span class=\"kudos-text font-bold text-emerald-400\">✨ [KUDOS] DNS Resolver restored! Hostnames can now be resolved to IP addresses.</span>";
                } else {
                    out = cleanCmd.replace(/echo\s+['"]?|['"]?\s+>>.*$/g, '');
                }
            }
            else if (base === 'ping' || base === 'ping6') {
                const target = parts[parts.length - 1];
                if (!state.ifaceUp) {
                    out = "ping: connect: Network is down";
                } else if (target === '127.0.0.1' || target === '::1') {
                    out = `64 bytes from ${target}: icmp_seq=1 ttl=64 time=0.035 ms\n64 bytes from ${target}: icmp_seq=2 ttl=64 time=0.038 ms\n--- ${target} ping statistics ---\n2 packets transmitted, 2 received, 0% packet loss`;
                } else if (target === '8.8.8.8') {
                    if (state.screen === 9 && !state.capstoneFaults.gateway) {
                        out = "connect: Network is unreachable";
                    } else {
                        out = "64 bytes from 8.8.8.8: icmp_seq=1 ttl=115 time=14.2 ms\n64 bytes from 8.8.8.8: icmp_seq=2 ttl=115 time=14.1 ms\n--- 8.8.8.8 ping statistics ---\n2 packets transmitted, 2 received, 0% packet loss";
                        if (state.screen === 8) {
                            kudos = "\n\n<span class=\"kudos-text font-bold text-emerald-400\">✨ [KUDOS] Layer 3 Internet reachability verified! Your gateway path is working.</span>";
                            if (!state.completedScreens.includes(8)) state.completedScreens.push(8);
                        }
                    }
                } else if (target === 'google.com' || target === 'example.com') {
                    if (state.screen === 9) {
                        if (!state.capstoneFaults.gateway) {
                            out = "connect: Network is unreachable";
                        } else if (!state.capstoneFaults.dns) {
                            out = "ping: google.com: Temporary failure in name resolution";
                        } else {
                            out = "PING google.com (142.250.190.14) 56(84) bytes of data.\n64 bytes from 142.250.190.14: icmp_seq=1 ttl=117 time=15.2 ms\n64 bytes from 142.250.190.14: icmp_seq=2 ttl=117 time=15.1 ms\n--- google.com ping statistics ---\n2 packets transmitted, 2 received, 0% packet loss";
                            state.missionComplete = true;
                            kudos = "\n\n<span class=\"kudos-text font-bold text-emerald-400\">🎉 MISSION COMPLETE! Both Layer 3 Routing and Layer 7 DNS are fully operational!</span>";
                        }
                    } else {
                        out = "PING google.com (142.250.190.14) 56(84) bytes of data.\n64 bytes from 142.250.190.14: icmp_seq=1 ttl=117 time=15.2 ms";
                    }
                } else {
                    out = `ping: ${target}: Name or service not known`;
                }
            }
            else if (base === 'ss' || base === 'netstat') {
                out = "Netid  State   Recv-Q  Send-Q   Local Address:Port   Peer Address:Port  Process\ntcp    LISTEN  0       128            0.0.0.0:22          0.0.0.0:*      users:((\"sshd\",pid=812,fd=3))\ntcp    LISTEN  0       511            0.0.0.0:80          0.0.0.0:*      users:((\"nginx\",pid=944,fd=6))\ntcp    LISTEN  0       128               [::]:22             [::]:*      users:((\"sshd\",pid=812,fd=4))\nudp    UNCONN  0       0            127.0.0.1:323         0.0.0.0:*      users:((\"chronyd\",pid=650,fd=5))";
            }
            else if (base === 'nc') {
                out = "Connection to 10.0.0.1 53 port [tcp/domain] succeeded!";
            }
            else if (base === 'chronyc') {
                out = "MS Name/IP address         Stratum Poll Reach LastRx Last sample               \n===============================================================================\n^* time.cloudflare.com           3   6   377    24   -120us[ -140us] +/-   12ms\n^+ time.google.com               1   6   377    25   +340us[ +320us] +/-   18ms";
            }
            else if (base === 'ethtool') {
                out = `Settings for ens32:\n\tSupported ports: [ TP ]\n\tSpeed: 1000Mb/s\n\tDuplex: Full\n\tPort: Twisted Pair\n\tAuto-negotiation: on\n\tLink detected: ${state.ifaceUp ? 'yes' : 'no'}`;
            }
            else if (base === 'traceroute' || base === 'tracepath') {
                out = "traceroute to 8.8.8.8 (8.8.8.8), 30 hops max, 60 byte packets\n 1  10.0.0.1 (10.0.0.1)  1.214 ms  1.198 ms  1.185 ms\n 2  96.120.40.1 (96.120.40.1)  9.421 ms  9.405 ms  9.389 ms\n 3  8.8.8.8 (8.8.8.8)  14.215 ms  14.180 ms  14.162 ms";
            }
            else if (base === 'dig' || base === 'host') {
                out = ";; ANSWER SECTION:\nexample.com.\t\t300\tIN\tA\t93.184.216.34\n\n;; Query time: 14 msec\n;; SERVER: 8.8.8.8#53(8.8.8.8)";
            }
            else {
                out = `-bash: ${base}: command not found. Type 'help' for available commands.`;
            }

            state.terminalHistory.push({ input: cmd, output: out + kudos });
        }

        // --- Live Network Topology SVG Renderer ---
        function renderTopologyDiagram() {
            const container = document.getElementById('topology-diagram-container');
            if (!container) return;

            const isGwActive = state.capstoneFaults.gateway || state.screen !== 9;
            const isDnsActive = state.capstoneFaults.dns || state.screen !== 9;

            container.innerHTML = `
                <div class="space-y-4">
                    <p class="text-xs text-slate-600">
                        Visualizing active link states, ARP boundaries, routing path, and external name resolution hops for <span class="font-mono text-sky-700 font-bold">server-one</span>.
                    </p>

                    <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 relative overflow-hidden shadow-inner">
                        <svg viewBox="0 0 540 280" class="w-full h-auto">
                            <!-- Cables / Paths -->
                            <!-- Host to Switch -->
                            <line x1="90" y1="140" x2="210" y2="140" stroke="#0284c7" stroke-width="2.5" class="packet-cable"/>
                            
                            <!-- Switch to Gateway -->
                            <line x1="250" y1="140" x2="350" y2="140" stroke="${isGwActive ? '#059669' : '#e11d48'}" stroke-width="2.5" class="${isGwActive ? 'packet-cable' : ''}"/>
                            
                            <!-- Gateway to Internet -->
                            <line x1="390" y1="140" x2="470" y2="140" stroke="${isGwActive ? '#059669' : '#94a3b8'}" stroke-width="2"/>
                            
                            <!-- Gateway to DNS -->
                            <path d="M 370 115 L 370 65 L 450 65" fill="none" stroke="${isDnsActive ? '#7c3aed' : '#94a3b8'}" stroke-width="2" class="${isDnsActive ? 'packet-cable' : ''}"/>

                            <!-- Node 1: Host server-one -->
                            <g transform="translate(40, 105)">
                                <rect width="70" height="70" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
                                <text x="35" y="32" fill="#0369a1" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">server-one</text>
                                <text x="35" y="48" fill="#64748b" font-size="8" font-family="monospace" text-anchor="middle">10.0.0.84</text>
                                <circle cx="35" cy="58" r="3" fill="#059669"/>
                            </g>

                            <!-- Node 2: Layer 2 Switch -->
                            <g transform="translate(200, 115)">
                                <rect width="60" height="50" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
                                <text x="30" y="28" fill="#1e293b" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">Switch</text>
                                <text x="30" y="40" fill="#64748b" font-size="7" font-family="monospace" text-anchor="middle">Layer 2 LAN</text>
                            </g>

                            <!-- Node 3: Default Gateway -->
                            <g transform="translate(340, 110)">
                                <rect width="70" height="60" rx="12" fill="#ffffff" stroke="${isGwActive ? '#059669' : '#e11d48'}" stroke-width="2"/>
                                <text x="35" y="28" fill="${isGwActive ? '#059669' : '#e11d48'}" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">Gateway</text>
                                <text x="35" y="42" fill="#64748b" font-size="8" font-family="monospace" text-anchor="middle">10.0.0.1</text>
                                <text x="35" y="52" fill="${isGwActive ? '#059669' : '#e11d48'}" font-size="7" font-family="monospace" font-weight="bold" text-anchor="middle">${isGwActive ? 'ACTIVE' : 'NO ROUTE'}</text>
                            </g>

                            <!-- Node 4: DNS Server -->
                            <g transform="translate(440, 35)">
                                <rect width="75" height="55" rx="10" fill="#ffffff" stroke="${isDnsActive ? '#7c3aed' : '#94a3b8'}" stroke-width="1.5"/>
                                <text x="37" y="26" fill="${isDnsActive ? '#6d28d9' : '#64748b'}" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">DNS Server</text>
                                <text x="37" y="40" fill="#64748b" font-size="8" font-family="monospace" text-anchor="middle">8.8.8.8:53</text>
                            </g>

                            <!-- Node 5: Internet Cloud -->
                            <g transform="translate(460, 115)">
                                <rect width="70" height="50" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
                                <text x="35" y="28" fill="#0284c7" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">WAN / Web</text>
                                <text x="35" y="40" fill="#64748b" font-size="7" font-family="monospace" text-anchor="middle">google.com</text>
                            </g>
                        </svg>
                    </div>

                    <div class="grid grid-cols-2 gap-3 text-xs">
                        <div class="p-3 bg-white rounded-xl border border-slate-200 shadow-sm">
                            <span class="text-slate-500 block text-[10px] uppercase font-bold">Default Route (L3)</span>
                            <span class="font-mono font-bold ${isGwActive ? 'text-emerald-700' : 'text-rose-700'}">${isGwActive ? '10.0.0.1 (Configured)' : 'Missing from table'}</span>
                        </div>
                        <div class="p-3 bg-white rounded-xl border border-slate-200 shadow-sm">
                            <span class="text-slate-500 block text-[10px] uppercase font-bold">DNS Resolver (L7)</span>
                            <span class="font-mono font-bold ${isDnsActive ? 'text-purple-700' : 'text-rose-700'}">${isDnsActive ? '8.8.8.8 (Resolving)' : 'Not in resolv.conf'}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Key Terms Glossary Renderer & Filter ---
        function renderGlossary(filterText = '') {
            const container = document.getElementById('glossary-items');
            if (!container) return;

            const query = filterText.toLowerCase();
            const filtered = KEY_TERMS.filter(item => 
                item.term.toLowerCase().includes(query) || 
                item.definition.toLowerCase().includes(query) ||
                item.cat.toLowerCase().includes(query)
            );

            container.innerHTML = filtered.map(item => `
                <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 hover:border-sky-300 transition-all">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-bold text-slate-900">${item.term}</span>
                        <span class="text-[9px] font-mono px-2 py-0.5 rounded bg-sky-50 border border-sky-200 text-sky-700 uppercase font-semibold">${item.cat}</span>
                    </div>
                    <p class="text-xs text-slate-600 leading-relaxed">${item.definition}</p>
                </div>
            `).join('');
        }

        // Search Input Listener
        document.getElementById('glossary-search').oninput = function(e) {
            renderGlossary(e.target.value);
        };

        // --- Drawer Toggle Listeners ---
        const glossaryDrawer = document.getElementById('glossary-drawer');
        const topologyDrawer = document.getElementById('topology-drawer');

        document.getElementById('toggle-glossary-btn').onclick = () => {
            glossaryDrawer.classList.toggle('translate-x-full');
            topologyDrawer.classList.add('translate-x-full');
        };
        document.getElementById('close-glossary-btn').onclick = () => {
            glossaryDrawer.classList.add('translate-x-full');
        };

        document.getElementById('toggle-topology-btn').onclick = () => {
            topologyDrawer.classList.toggle('translate-x-full');
            glossaryDrawer.classList.add('translate-x-full');
            renderTopologyDiagram();
        };
        document.getElementById('close-topology-btn').onclick = () => {
            topologyDrawer.classList.add('translate-x-full');
        };

        // Navigation Button Listeners
        document.getElementById('prev-btn').onclick = () => {
            if (state.screen > 1) {
                state.screen--;
                state.hintLevel = -1;
                renderApp();
            }
        };

        document.getElementById('next-btn').onclick = () => {
            if (state.screen < state.totalScreens) {
                state.screen++;
                state.hintLevel = -1;
                renderApp();
            }
        };

        // Initial App Mount
        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
