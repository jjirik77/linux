        const glossaryTerms = [
            { term: "Shebang ( #! )", category: "Syntax", definition: "The two-character sequence ( #! ) on the first line of an executable script pointing to the path of the interpreter binary (e.g., #!/bin/bash)." },
            { term: "source or . (dot)", category: "Execution", definition: "A shell built-in command that reads and executes commands from a file in the current shell context without spawning a child subshell." },
            { term: "bash scriptname", category: "Execution", definition: "Spawns a new non-login child subshell to execute the script without requiring execute (+x) permissions." },
            { term: "chmod +x", category: "Permissions", definition: "Grants execute permission to a script file, permitting execution as a direct command (e.g., ./myscript.bash)." },
            { term: "Globbing", category: "Shell Expansion", definition: "Filename expansion using shell wildcards (*, ?, [a-z]) evaluated by the shell BEFORE the command executes." },
            { term: "Command Substitution", category: "Shell Expansion", definition: "Syntax $(command) or `command` that runs a command in a subshell and replaces the syntax with standard output." },
            { term: "Exit Status ( $? )", category: "Control Flow", definition: "A numeric code (0 to 255) returned by every executed command. 0 indicates success; any nonzero value indicates an error." },
            { term: "declare", category: "Variables", definition: "A built-in utility used to declare variables with specific attributes, such as integer arithmetic enforcement (-i) or read-only (-r)." },
            { term: "read", category: "Input", definition: "Reads a single line of input from standard input. If no variable name is provided, the input is placed into the default $REPLY variable." },
            { term: "Positional Parameters", category: "Variables", definition: "Variables ($0 to $9, $*, $@, $#) populated with arguments passed to the script or function on the command line." },
            { term: "test or [ ]", category: "Conditionals", definition: "Evaluates conditional expressions. In bracket notation, whitespace is mandatory after the opening '[' and before the closing ']'." },
            { term: "case", category: "Conditionals", definition: "A multi-way branching statement evaluated against patterns; more efficient and readable than deeply nested if/elif statements for menus." },
            { term: "while", category: "Loops", definition: "A looping structure that repeats its block as long as the condition evaluates to TRUE (exit status 0)." },
            { term: "until", category: "Loops", definition: "A looping structure that repeats its block as long as the condition evaluates to FALSE (nonzero exit status), terminating once true." },
            { term: "tr", category: "Text Processing", definition: "Translate tool that translates, squeezes (-s), or deletes (-d) characters from standard input to standard output." },
            { term: "cut", category: "Text Processing", definition: "Extracts sections or columns from each line of input using delimiters (-d) and field numbers (-f) or byte/character positions (-c)." },

        function goToScreen(idx) {
            if (idx < 0 || idx >= modules.length) return;
            state.currentScreen = idx;
            
            // Render screen HTML
            const stage = document.getElementById('screenStage');
            stage.className = 'screen-anim';
            stage.innerHTML = modules[idx].render();
            
            // Update progress bar
            const progress = ((idx) / (modules.length - 1)) * 100;
            document.getElementById('moduleProgressBar').style.width = `${progress}%`;
            document.getElementById('moduleCounter').innerText = `${idx + 1} / ${modules.length}`;
            
            // Update navigation buttons
            const prevBtn = document.getElementById('btnPrevScreen');
            const nextBtn = document.getElementById('btnNextScreen');
            prevBtn.disabled = (idx === 0);
            
            if (idx === modules.length - 1) {
                nextBtn.innerHTML = `Finish Lab <i class="fas fa-check ml-1.5"></i>`;
                nextBtn.className = "inline-flex items-center px-5 py-2 text-sm font-semibold rounded-lg text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none transition shadow-sm";

        function writeToTerminal(termId, text, isCmd = false, color = "text-slate-200") {
            const term = document.getElementById(termId);
            if (!term) return;
            const line = document.createElement('div');
            line.className = `mt-1 font-mono text-xs ${color}`;
            line.innerHTML = isCmd ? `<span class="text-teal-400 font-semibold">$</span> ${text}` : text;
            term.appendChild(line);
            term.scrollTop = term.scrollHeight;
        }

        function clearTerminal(termId) {
            const term = document.getElementById(termId);
            if (term) term.innerHTML = `<div class="text-slate-400 text-xs font-mono">Terminal cleared.</div>`;
        }

        function runLab1Execution(type) {
            const orderStr = state.assembledBlocks.join('-');

            if (type === 'bash') {
                writeToTerminal('term1', 'bash myscript.bash', true);
                if (orderStr === 'shebang-comment-echo' || orderStr === 'shebang-echo') {
                    writeToTerminal('term1', 'Hello from Bash', false, 'text-emerald-400');
                    showToast("Success! 'bash myscript.bash' reads the file directly.", "fa-check", "bg-emerald-700");
                } else if (!state.assembledBlocks.includes('shebang')) {
                    writeToTerminal('term1', 'myscript.bash: line 1: Warning: Missing shebang interpreter designation.', false, 'text-amber-400');
                } else {
                    writeToTerminal('term1', 'Hello from Bash (Executed, but check line ordering)', false, 'text-amber-300');
                }
            } else if (type === 'chmod') {
                writeToTerminal('term1', 'chmod +x myscript.bash', true);
                state.hasExecutablePermission = true;
                document.getElementById('scriptFilePermsBadge').innerText = "Permissions: -rwxr-xr-x";
                document.getElementById('scriptFilePermsBadge').className = "text-emerald-400 font-sans font-semibold";
                writeToTerminal('term1', 'Permissions changed to -rwxr-xr-x (executable bit set).', false, 'text-slate-300');
                showToast("Permissions updated! Execute with ./myscript.bash", "fa-lock-open", "bg-teal-700");
            } else if (type === 'dot_slash') {
                writeToTerminal('term1', './myscript.bash', true);
                if (!state.hasExecutablePermission) {
                    writeToTerminal('term1', 'bash: ./myscript.bash: Permission denied', false, 'text-rose-400');
                    showToast("Error: Direct execution requires chmod +x first!", "fa-circle-xmark", "bg-rose-700");
                } else if (orderStr.startsWith('shebang')) {
                    writeToTerminal('term1', 'Hello from Bash', false, 'text-emerald-400');
                    showToast("Executed successfully via direct path!", "fa-circle-check", "bg-emerald-700");
                } else {
                    writeToTerminal('term1', 'bash: exec format error or missing shebang on line 1', false, 'text-rose-400');
                }
            } else if (type === 'source') {
                writeToTerminal('term1', 'source myscript.bash', true);
                writeToTerminal('term1', 'Hello from Bash', false, 'text-emerald-400');
                writeToTerminal('term1', '(Note: source runs commands inside the CURRENT shell context.)', false, 'text-sky-300');
                showToast("Ran in current shell session using source.", "fa-bolt", "bg-sky-700");
            }
        }

                    <div class="text-teal-400">Input entered: "${val}"</div>
                    <div class="text-emerald-400 font-bold mt-1">$ echo $username &rarr; "${val}"</div>
                    <div class="text-slate-400 text-[10px]">Stored in user variable $username.</div>
                `;
            }
            showToast("read input simulated successfully", "fa-check", "bg-teal-700");
        }

        function runFunctionDemo() {
            showToast("Function timestamp() returned current date & time", "fa-clock", "bg-teal-700");
        }

        function validateBracketSyntax(isValid) {
            const fb = document.getElementById('bracketFeedback');
            if (isValid) {
                fb.innerHTML = `<span class="text-emerald-700 font-bold"><i class="fas fa-check-circle"></i> Correct:</span> The shell recognizes '[' as a command and evaluates the arguments properly with spaces.`;
            } else {
                fb.innerHTML = `<span class="text-rose-700 font-bold"><i class="fas fa-circle-xmark"></i> Syntax Error:</span> Without spaces, Bash attempts to find an executable named '[0' instead of the test command '['.`;
            }
        }

        function showOperatorExplanation(op) {
            const box = document.getElementById('operatorDetailBox');
            const map = {
                '-lt': "<strong>-lt (Less Than):</strong> [ $RAM -lt 4096 ] &mdash; returns 0 if RAM is strictly less than 4096.",
                '-eq': "<strong>-eq (Equal):</strong> [ $EUID -eq 0 ] &mdash; verifies if the current user ID equals 0 (root).",
                '-f': "<strong>-f (Regular File):</strong> [ -f /etc/hosts ] &mdash; verifies the path exists AND is a regular file (not directory).",
                '-d': "<strong>-d (Directory):</strong> [ -d /var/log ] &mdash; returns true only if the directory exists."
            };
            box.innerHTML = map[op] || "";
        }

        function runLoopSimulation(type) {
            clearTerminal('term6');
            if (type === 'while') {
                writeToTerminal('term6', 'count=1; while [ $count -le 3 ]; do echo "Num: $count"; count=$((count+1)); done', true);
                writeToTerminal('term6', 'Num: 1');
                writeToTerminal('term6', 'Num: 2');
                writeToTerminal('term6', 'Num: 3');
                writeToTerminal('term6', 'Loop ended when count became 4 (condition returned false).', false, 'text-teal-400');
            } else if (type === 'until') {
                writeToTerminal('term6', 'count=1; until [ $count -gt 3 ]; do echo "Num: $count"; count=$((count+1)); done', true);
                writeToTerminal('term6', 'Num: 1');
                writeToTerminal('term6', 'Num: 2');
                writeToTerminal('term6', 'Num: 3');
                writeToTerminal('term6', 'Loop ended when count became 4 (condition returned true).', false, 'text-indigo-400');
            } else if (type === 'for') {
                writeToTerminal('term6', 'for i in {1..3}; do echo "Server: $i"; done', true);
                writeToTerminal('term6', 'Server: 1');
                writeToTerminal('term6', 'Server: 2');
                writeToTerminal('term6', 'Server: 3');
            } else if (type === 'debug') {
                writeToTerminal('term6', 'bash -x loop_test.sh', true);
                writeToTerminal('term6', '+ count=1', false, 'text-amber-300');
                writeToTerminal('term6', '+ \'[\' 1 -le 3 \']\'', false, 'text-amber-300');
                writeToTerminal('term6', '+ echo Num: 1', false, 'text-amber-300');
                writeToTerminal('term6', 'Num: 1', false, 'text-slate-200');
                writeToTerminal('term6', '+ count=2', false, 'text-amber-300');
                writeToTerminal('term6', '+ \'[\' 2 -le 3 \']\'', false, 'text-amber-300');
                writeToTerminal('term6', 'Num: 2', false, 'text-slate-200');
                writeToTerminal('term6', '+ count=3', false, 'text-amber-300');
                writeToTerminal('term6', '+ \'[\' 3 -le 3 \']\'', false, 'text-amber-300');
                writeToTerminal('term6', 'Num: 3', false, 'text-slate-200');
                writeToTerminal('term6', '+ count=4', false, 'text-amber-300');
                writeToTerminal('term6', '+ \'[\' 4 -le 3 \']\'', false, 'text-amber-300');
            }
        }

        function runText1Tool(action) {
            clearTerminal('term7');
            if (action === 'tr_upper') {
                writeToTerminal('term7', 'echo "linux bash" | tr a-z A-Z', true);
                writeToTerminal('term7', 'LINUX BASH', false, 'text-emerald-400');
            } else if (action === 'tr_del') {
                writeToTerminal('term7', 'tr -d \'\\r\' < winfile.txt > linux.txt', true);
                writeToTerminal('term7', 'Stripped carriage return (CR) characters from file stream.', false, 'text-teal-400');
            } else if (action === 'tr_squeeze') {
                writeToTerminal('term7', 'who | tr -s " " " "', true);
                writeToTerminal('term7', 'student1 tty1 2026-09-23 09:30');
                writeToTerminal('term7', 'admin pts/0 2026-09-23 10:15');
            } else if (action === 'cut_users') {
                writeToTerminal('term7', 'who | tr -s " " | cut -d " " -f1', true);
                writeToTerminal('term7', 'student1', false, 'text-sky-300');
                writeToTerminal('term7', 'admin', false, 'text-sky-300');
            } else if (action === 'cut_multi') {
                writeToTerminal('term7', 'cut -d ":" -f1,7 /etc/passwd | head -n 2', true);
                writeToTerminal('term7', 'root:/bin/bash');
                writeToTerminal('term7', 'bin:/sbin/nologin');
            } else if (action === 'nl') {
                writeToTerminal('term7', 'nl -b a script.bash', true);
                writeToTerminal('term7', '     1  #!/bin/bash');
                writeToTerminal('term7', '     2  # Automated healthcheck');
                writeToTerminal('term7', '     3  df -h');
            } else if (action === 'od') {
                writeToTerminal('term7', 'od -c textfile.txt', true);
                writeToTerminal('term7', '0000000   l   i   n   u   x  \\r  \\n');
                writeToTerminal('term7', '(Notice the hidden Windows \\r return identified!)', false, 'text-amber-300');
            }
        }

        function runText2Tool(action) {
            clearTerminal('term8');
            if (action === 'sed_sub') {
                writeToTerminal('term8', "sed 's/Jane/Margaret/' student_records.csv", true);
                writeToTerminal('term8', 'Margaret,F,Math,14,88', false, 'text-emerald-300');
                writeToTerminal('term8', 'Bruce,M,Algebra,15,72');
                writeToTerminal('term8', 'Amy,F,Algebra,14,91');
                writeToTerminal('term8', 'Ben,M,Science,16,84');
            } else if (action === 'sed_print') {
                writeToTerminal('term8', "sed -n 's/Algebra/German/p' student_records.csv", true);
                writeToTerminal('term8', 'Bruce,M,German,15,72', false, 'text-emerald-400');
                writeToTerminal('term8', 'Amy,F,German,14,91', false, 'text-emerald-400');
                writeToTerminal('term8', '(-n suppressed unchanged lines)', false, 'text-slate-400');
            } else if (action === 'awk_fields') {
                writeToTerminal('term8', "awk -F \",\" '{print $1 \" scored \" $5}' student_records.csv", true);
                writeToTerminal('term8', 'Jane scored 88');
                writeToTerminal('term8', 'Bruce scored 72');
                writeToTerminal('term8', 'Amy scored 91');
                writeToTerminal('term8', 'Ben scored 84');
            } else if (action === 'awk_filter') {
                writeToTerminal('term8', "awk -F \",\" '$5 > 85 {print \"Honor: \" $1}' student_records.csv", true);
                writeToTerminal('term8', 'Honor: Jane', false, 'text-teal-400');
                writeToTerminal('term8', 'Honor: Amy', false, 'text-teal-400');
            } else if (action === 'sort_uniq') {
                writeToTerminal('term8', 'sort raw_ips.log | uniq -c', true);
                writeToTerminal('term8', '      3 10.0.0.1');
                writeToTerminal('term8', '      1 10.0.0.5');
                writeToTerminal('term8', '      8 192.168.1.100');
            } else if (action === 'wc_demo') {
                writeToTerminal('term8', 'wc -l student_records.csv', true);
                writeToTerminal('term8', '4 student_records.csv', false, 'text-teal-300');
            } else if (action === 'head_tail') {
                writeToTerminal('term8', 'head -n 2 student_records.csv', true);
                writeToTerminal('term8', 'Jane,F,Math,14,88');
                writeToTerminal('term8', 'Bruce,M,Algebra,15,72');
            }
        }

        function handleMasteryChoice(qId, optIdx, isCorrect, explanation) {
            if (state.masteryAnswers[qId] !== undefined) return; // Prevent re-answering
            state.masteryAnswers[qId] = isCorrect;

            if (isCorrect) state.score++;
            document.getElementById('scoreIndicatorBadge').innerText = `Score: ${state.score}`;

            const qCard = document.getElementById(`qcard-${qId}`);
            const buttons = qCard.querySelectorAll('.quiz-btn');
            
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === optIdx) {
                    if (isCorrect) {
                        btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900', 'font-semibold');
                        btn.querySelector('.badge-icon').innerHTML = `<i class="fas fa-check text-emerald-600"></i>`;
                    } else {
                        btn.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900', 'font-semibold');
                        btn.querySelector('.badge-icon').innerHTML = `<i class="fas fa-xmark text-rose-600"></i>`;
                    }
                    btn.querySelector('.badge-icon').classList.remove('hidden');
                }
            });

            const fb = document.getElementById(`${qId}-feedback`);
            fb.classList.remove('hidden');
            fb.className = `text-xs p-2.5 rounded ${isCorrect ? 'bg-emerald-50 text-emerald-900 border border-emerald-200' : 'bg-rose-50 text-rose-900 border border-rose-200'}`;
            fb.innerHTML = `<strong>${isCorrect ? 'Correct!' : 'Incorrect.'}</strong> ${explanation}`;

            // Update counter
            const answeredCount = Object.keys(state.masteryAnswers).length;
            const counter = document.getElementById('quizAnsweredCount');
            if (counter) counter.innerText = `${answeredCount} / 10`;

            showToast(isCorrect ? "Correct answer!" : "Review the rationale note.", isCorrect ? "fa-check" : "fa-circle-info", isCorrect ? "bg-emerald-700" : "bg-slate-800");
        }

        function restartCourse() {
            state.score = 0;
            state.masteryAnswers = {};
            document.getElementById('scoreIndicatorBadge').innerText = `Score: 0`;
            goToScreen(0);
        }

        // Initialize on window load
        window.addEventListener('load', initApp);
    </script>
</body>
</html>
